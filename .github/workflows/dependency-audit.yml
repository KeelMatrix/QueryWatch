name: Dependency vulnerability audit

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerable-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.408'
      - name: Restore dependencies
        run: dotnet restore KeelMatrix.QueryWatch.sln --configfile NuGet.config
      - name: Check for vulnerable dependencies
        shell: bash
        run: |
          set -o pipefail
          report="$(dotnet list KeelMatrix.QueryWatch.sln package --vulnerable --include-transitive 2>&1)"
          status=$?
          printf '%s\n' "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if printf '%s\n' "$report" | grep -Eiq 'has the following vulnerable package'; then
            exit 1
          fi
